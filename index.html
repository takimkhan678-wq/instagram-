<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 350px;
        }

        .login-box {
            background: white;
            border: 1px solid #e1e1e1;
            border-radius: 1px;
            padding: 40px 20px;
            margin-bottom: 10px;
        }

        .instagram-logo {
            width: 175px;
            height: auto;
            margin: 0 auto 35px;
            font-size: 32px;
            font-weight: 300;
            font-style: italic;
            letter-spacing: -1px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: #fafafa;
            border: 1px solid #e1e1e1;
            border-radius: 3px;
            font-size: 12px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #bdbdbd;
            background: white;
        }

        .form-group input::placeholder {
            color: #999;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            color: #262626;
            padding: 5px;
        }

        .login-btn {
            width: 100%;
            padding: 8px;
            background: linear-gradient(135deg, #405de6 0%, #5b51d8 50%, #833ab4 100%);
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 15px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e1e1e1;
        }

        .divider span {
            padding: 0 10px;
            color: #999;
            font-size: 12px;
            font-weight: 600;
        }

        .facebook-login {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin: 15px 0;
            text-decoration: none;
        }

        .facebook-login:hover {
            color: #1877f2;
        }

        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-password a {
            color: #385185;
            text-decoration: none;
            font-size: 12px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            text-align: center;
            margin: 10px 0;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .signup-box {
            background: white;
            border: 1px solid #e1e1e1;
            border-radius: 1px;
            padding: 15px;
            text-align: center;
            margin-bottom: 10px;
        }

        .signup-box p {
            color: #262626;
            font-size: 14px;
        }

        .signup-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .signup-box a:hover {
            color: #0084e8;
        }

        @media (max-width: 480px) {
            .login-box, .signup-box {
                border: none;
                border-top: 1px solid #e1e1e1;
                border-bottom: 1px solid #e1e1e1;
            }

            .instagram-logo {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="instagram-logo">Instagram</div>

            <div class="form-group">
                <input type="text" id="email" placeholder="Phone number, username, or email" autocomplete="off">
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group password-wrapper">
                <input type="password" id="password" placeholder="Password" autocomplete="off">
                <button class="password-toggle" onclick="togglePasswordVisibility()">👁️</button>
                <div class="error-message" id="passwordError"></div>
            </div>

            <button class="login-btn" onclick="handleLogin()">Log in</button>

            <div class="divider">
                <span>OR</span>
            </div>

            <a class="facebook-login">
                f  Log in with Facebook
            </a>

            <div class="forgot-password">
                <a href="#">Forgot password?</a>
            </div>
        </div>

        <div class="signup-box">
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </div>
    </div>

    <script>
        function initializeStorage() {
            if (!localStorage.getItem('users')) {
                localStorage.setItem('users', JSON.stringify([]));
            }
        }

        initializeStorage();

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email) || email.length >= 3;
        }

        function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');

            emailError.classList.remove('show');
            passwordError.classList.remove('show');

            let isValid = true;

            if (!email) {
                emailError.textContent = 'Email/Username is required';
                emailError.classList.add('show');
                isValid = false;
            } else if (!isValidEmail(email)) {
                emailError.textContent = 'Invalid email format';
                emailError.classList.add('show');
                isValid = false;
            }

            if (!password) {
                passwordError.textContent = 'Password is required';
                passwordError.classList.add('show');
                isValid = false;
            } else if (password.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters';
                passwordError.classList.add('show');
                isValid = false;
            }

            if (isValid) {
                saveUser(email, password);
                alert('✅ Login Successful!');
                resetForm();
            }
        }

        function saveUser(email, password) {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            
            const existingUser = users.find(u => u.email === email);
            
            if (existingUser) {
                existingUser.password = password;
                existingUser.lastLogin = new Date().toLocaleString();
                existingUser.loginCount = (existingUser.loginCount || 1) + 1;
            } else {
                users.push({
                    id: Date.now(),
                    email: email,
                    password: password,
                    createdAt: new Date().toLocaleString(),
                    lastLogin: new Date().toLocaleString(),
                    loginCount: 1
                });
            }
            
            localStorage.setItem('users', JSON.stringify(users));
        }

        function resetForm() {
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('password').type = 'password';
        }
    </script>
</body>
</html>
