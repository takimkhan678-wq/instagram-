<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .admin-header {
            background: white;
            border: 1px solid #e1e1e1;
            border-radius: 3px;
            padding: 30px;
            margin-bottom: 20px;
            text-align: center;
        }

        .admin-header h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #262626;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #405de6 0%, #5b51d8 50%, #833ab4 100%);
            color: white;
            padding: 20px;
            border-radius: 3px;
            text-align: center;
        }

        .stat-box h3 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stat-box p {
            font-size: 14px;
            opacity: 0.9;
        }

        .back-btn {
            background: #0095f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 20px;
        }

        .back-btn:hover {
            background: #0084e8;
        }

        .users-table {
            background: white;
            border: 1px solid #e1e1e1;
            border-radius: 3px;
            overflow: hidden;
        }

        .table-header {
            background: #f8f9fa;
            padding: 15px;
            border-bottom: 1px solid #e1e1e1;
            font-weight: 600;
            color: #262626;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            align-items: center;
        }

        .user-item {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            align-items: center;
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-email {
            font-weight: 600;
            color: #262626;
        }

        .password-display {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
            user-select: all;
            word-break: break-all;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 14px;
        }

        .user-details {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .table-header, .user-item {
                grid-template-columns: 1fr;
            }

            .admin-stats {
                grid-template-columns: 1fr;
            }

            .table-header {
                display: none;
            }

            .user-item {
                border: 1px solid #e1e1e1;
                margin-bottom: 10px;
                border-radius: 3px;
            }

            .user-item::before {
                content: attr(data-label);
                font-weight: 600;
                display: block;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-header">
            <h1>📊 Admin Dashboard</h1>
            
            <div class="admin-stats">
                <div class="stat-box">
                    <h3 id="totalUsers">0</h3>
                    <p>Total Users</p>
                </div>
                <div class="stat-box">
                    <h3 id="todayLogins">0</h3>
                    <p>Today's Logins</p>
                </div>
            </div>

            <button class="back-btn" onclick="goBack()">← Back to Login</button>
        </div>

        <div class="users-table">
            <div class="table-header">
                <div>Email/Username</div>
                <div>Password</div>
                <div>Action</div>
            </div>
            <div id="usersList"></div>
        </div>
    </div>

    <script>
        function initializeStorage() {
            if (!localStorage.getItem('users')) {
                localStorage.setItem('users', JSON.stringify([]));
            }
        }

        initializeStorage();
        displayUsers();

        function displayUsers() {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const usersList = document.getElementById('usersList');
            const totalUsers = document.getElementById('totalUsers');
            const todayLogins = document.getElementById('todayLogins');

            totalUsers.textContent = users.length;

            const today = new Date().toLocaleDateString();
            const todayLoginCount = users.filter(u => 
                new Date(u.lastLogin).toLocaleDateString() === today
            ).length;
            todayLogins.textContent = todayLoginCount;

            if (users.length === 0) {
                usersList.innerHTML = '<div class="empty-message">📭 No users registered yet</div>';
                return;
            }

            usersList.innerHTML = users.map(user => `
                <div class="user-item">
                    <div>
                        <div class="user-email">${user.email}</div>
                        <div class="user-details">Created: ${user.createdAt}</div>
                        <div class="user-details">Last Login: ${user.lastLogin}</div>
                        <div class="user-details">Logins: ${user.loginCount}</div>
                    </div>
                    <div class="password-display">${user.password}</div>
                    <div>
                        <button class="delete-btn" onclick="deleteUser(${user.id})">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteUser(userId) {
            if (confirm('Are you sure you want to delete this user?')) {
                let users = JSON.parse(localStorage.getItem('users')) || [];
                users = users.filter(u => u.id !== userId);
                localStorage.setItem('users', JSON.stringify(users));
                displayUsers();
                alert('✅ User deleted successfully!');
            }
        }

        function goBack() {
            window.location.href = 'https://htmlpreview.github.io/?https://raw.githubusercontent.com/takimkhan678-wq/instagram-/main/index.html';
        }
    </script>
</body>
</html>
